<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Campus Gig Board</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Permanent+Marker&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .auth-card::before {
      content: '📎';
      position: absolute;
      top: -22px; left: 22px;
      font-size: 2rem;
      transform: rotate(-12deg);
    }
    .auth-title {
      font-family: var(--font-title);
      font-size: 2.4rem;
      letter-spacing: .06em;
      margin-bottom: .2rem;
    }
    .auth-sub {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--ink-mute);
      margin-bottom: 1.6rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: .82rem;
      color: var(--ink-mute);
      font-family: var(--font-mono);
    }
    .auth-footer a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: underline;
    }
    .logo-pill {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--ink);
      color: var(--accent-y);
      font-family: var(--font-title);
      font-size: 1.1rem;
      letter-spacing: .1em;
      padding: .4rem 1rem;
      border-radius: 30px;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .flash-msg {
      background: var(--accent-r);
      color: #fff;
      font-family: var(--font-mono);
      font-size: .78rem;
      padding: .6rem .9rem;
      border: 2px solid var(--ink);
      border-radius: 4px;
      margin-bottom: 1rem;
      box-shadow: 2px 2px 0 var(--ink);
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="logo-pill">🎓 Campus Gig Board</div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">LOG IN TO YOUR ACCOUNT</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <div class="flash-msg">⚠️ {{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login">
        <div class="form-row">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@college.edu" required/>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:.8rem">🔑 Log In</button>
      </form>

      <div class="auth-footer">
        New here? <a href="/register">Create an account →</a>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</body>
</html>
